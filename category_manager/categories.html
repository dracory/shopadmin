<div id="app">
  <template v-if="loading">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading data...</span>
      </div>
    </div>
  </template>

  <template v-else>
    <!-- Filter Bar -->
    <div class="card bg-body-tertiary mb-3">
      <div class="card-body d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <button @click="openFilterModal()" class="btn btn-primary me-3">
            <i class="bi bi-funnel me-1"></i> Filters
          </button>
          <span class="text-body">{{ filterStatus }}</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <select v-model="perPage" @change="changePerPage()" class="form-select form-select-sm" style="width: auto;">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="500">500</option>
          </select>
          <button
            @click="clearFilters()"
            class="btn btn-sm btn-outline-secondary"
            title="Clear all filters"
            v-if="hasActiveFilters"
          >
            <i class="bi bi-x-circle"></i>
          </button>
          <button class="btn btn-primary btn-sm" @click="loadCategories">
            <i class="bi bi-arrow-clockwise me-1"></i> Refresh
          </button>
        </div>
      </div>
    </div>

    <!-- Categories Table -->
    <div v-if="categories.length === 0" class="text-center py-4 text-muted border rounded">
      No categories found matching your criteria.
    </div>

    <div v-else class="table-responsive">
      <table class="table table-striped table-hover table-bordered align-middle">
        <thead>
          <tr>
            <th>
              <input type="checkbox" v-model="selectAll" @change="toggleSelectAll">
            </th>
            <th @click="sortBy('id')" style="cursor: pointer;">
              ID
              <span v-if="sortByColumn === 'id'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th @click="sortBy('title')" style="cursor: pointer;">
              Title
              <span v-if="sortByColumn === 'title'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th>Description</th>
            <th @click="sortBy('status')" style="cursor: pointer; width: 120px;">
              Status
              <span v-if="sortByColumn === 'status'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th @click="sortBy('created_at')" style="cursor: pointer; width: 1px; white-space: nowrap;">
              Created
              <span v-if="sortByColumn === 'created_at'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th @click="sortBy('updated_at')" style="cursor: pointer; width: 1px; white-space: nowrap;">
              Updated
              <span v-if="sortByColumn === 'updated_at'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="category in categories" :key="category.id">
            <td>
              <input type="checkbox" v-model="selectedCategories" :value="category.id">
            </td>
            <td>{{ category.id }}</td>
            <td>{{ category.title }}</td>
            <td class="small">{{ category.description }}</td>
            <td>
              <span class="badge" :class="getStatusBadgeClass(category.status)">
                {{ category.status }}
              </span>
            </td>
            <td class="small" style="white-space: nowrap;">{{ formatDate(category.created_at) }}</td>
            <td class="small" style="white-space: nowrap;">{{ formatDate(category.updated_at) }}</td>
            <td>
              <a :href="urls.categoryUpdate + '&category_id=' + category.id" class="btn btn-sm btn-primary me-1" title="Edit">
                <i class="bi bi-pencil"></i>
              </a>
              <button class="btn btn-sm btn-danger" @click="deleteCategory(category.id)" title="Delete">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div v-if="totalCategories > 0" class="d-flex justify-content-between align-items-center mt-3">
      <div class="text-muted small">
        Showing {{ (currentPage * perPage) + 1 }}-{{ Math.min((currentPage + 1) * perPage, totalCategories) }} of {{ totalCategories }} categories
      </div>
      <div class="d-flex align-items-center justify-content-center flex-grow-1">
        <div class="d-flex align-items-center gap-2">
          <span class="small text-muted">Page</span>
          <div class="btn-group" role="group">
            <button
              @click="goToPage(currentPage - 1)"
              class="btn btn-sm btn-outline-secondary"
              :disabled="currentPage === 0"
              title="Previous page"
            >
              &laquo;
            </button>
            <select v-model.number="currentPage" @change="goToPage(currentPage)" class="form-select form-select-sm bg-primary text-white border-primary" style="width: auto; border-radius: 0;">
              <option v-for="page in totalPages" :key="page" :value="page - 1">{{ page }}</option>
            </select>
            <button
              @click="goToPage(currentPage + 1)"
              class="btn btn-sm btn-outline-secondary"
              :disabled="currentPage >= totalPages - 1"
              title="Next page"
            >
              &raquo;
            </button>
          </div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="small">Per page</span>
        <select v-model="perPage" @change="changePerPage()" class="form-select form-select-sm" style="width: auto;">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </div>
    </div>

    <!-- Delete Selected -->
    <div v-if="selectedCategories.length > 0" class="mt-3">
      <button class="btn btn-danger" @click="deleteSelectedCategories">
        Delete Selected ({{ selectedCategories.length }})
      </button>
    </div>

    <!-- Filter Modal -->
    <template v-if="showFilterModal">
      <div class="modal-backdrop fade show" style="display: block; z-index: 1040;"></div>
      <div class="modal fade show" style="display: block; z-index: 1050;">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Filter Categories</h5>
              <button type="button" class="btn-close" @click="closeFilterModal()"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Status</label>
                <select v-model="filters.status" class="form-select">
                  <option value="">All Statuses</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                  <option value="draft">Draft</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Sort By</label>
                <select v-model="sortByColumn" class="form-select">
                  <option value="created_at">Created</option>
                  <option value="updated_at">Updated</option>
                  <option value="title">Title</option>
                  <option value="status">Status</option>
                  <option value="id">ID</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Sort Order</label>
                <select v-model="sortOrder" class="form-select">
                  <option value="desc">Descending</option>
                  <option value="asc">Ascending</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" @click="clearFilters()">Clear Filters</button>
              <button type="button" class="btn btn-primary" @click="applyFilters()">Apply Filters</button>
            </div>
          </div>
        </div>
      </div>
    </template>
  </template>
</div>
