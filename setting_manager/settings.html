<div id="app">
  <template v-if="loading">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading data...</span>
      </div>
    </div>
  </template>

  <template v-else>
    <!-- Currency Card -->
    <div class="card mb-3">
      <div class="card-body d-flex align-items-center justify-content-between">
        <div>
          <h6 class="mb-1"><i class="bi bi-currency-exchange me-1"></i> Store Currency</h6>
          <div class="text-muted small">Prices across the shop are displayed in this currency.</div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <select v-model="currency" class="form-select" style="width: auto;">
            <option v-for="c in currencies" :key="c" :value="c">{{ c }}</option>
          </select>
          <button class="btn btn-primary" @click="saveCurrency" :disabled="savingCurrency">
            <span v-if="savingCurrency" class="spinner-border spinner-border-sm me-1"></span>
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="card bg-body-tertiary mb-3">
      <div class="card-body d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center flex-grow-1 me-3">
          <button @click="openFilterModal()" class="btn btn-primary me-3">
            <i class="bi bi-funnel me-1"></i> Filters
          </button>
          <span class="text-body">{{ filterStatus }}</span>
          <button
            @click="clearFilters()"
            class="btn btn-sm btn-outline-secondary ms-2"
            title="Clear all filters"
            v-if="hasActiveFilters"
          >
            <i class="bi bi-x-circle"></i>
          </button>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button
            v-if="selectedSettings.length > 0"
            class="btn btn-sm btn-danger"
            @click="deleteSelectedSettings"
            title="Delete selected"
          >
            <i class="bi bi-trash"></i> ({{ selectedSettings.length }})
          </button>
          <button class="btn btn-primary btn-sm" @click="openCreateModal">
            <i class="bi bi-plus-circle me-1"></i> New Setting
          </button>
        </div>
      </div>
    </div>

    <!-- Settings Table -->
    <div v-if="settings.length === 0" class="text-center py-4 text-muted border rounded">
      No settings found matching your criteria.
    </div>

    <div v-else class="table-responsive">
      <table class="table table-striped table-hover table-bordered align-middle">
        <thead>
          <tr>
            <th style="width: 1px; white-space: nowrap;">
              <input type="checkbox" v-model="selectAll" @change="toggleSelectAll">
            </th>
            <th @click="sortBy('setting_key')" style="cursor: pointer;">
              Key
              <span v-if="sortByColumn === 'setting_key'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th>Value</th>
            <th @click="sortBy('created_at')" style="cursor: pointer; width: 1px; white-space: nowrap;">
              Created
              <span v-if="sortByColumn === 'created_at'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th @click="sortBy('updated_at')" style="cursor: pointer; width: 1px; white-space: nowrap;">
              Updated
              <span v-if="sortByColumn === 'updated_at'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th style="width: 100px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="setting in settings" :key="setting.id">
            <td>
              <input type="checkbox" v-model="selectedSettings" :value="setting.id">
            </td>
            <td><code>{{ setting.key }}</code></td>
            <td style="word-break: break-all;">{{ setting.value }}</td>
            <td class="small" style="white-space: nowrap;">{{ formatDate(setting.created_at) }}</td>
            <td class="small" style="white-space: nowrap;">{{ formatDate(setting.updated_at) }}</td>
            <td>
              <button class="btn btn-sm btn-primary me-1" @click="openEditModal(setting)" title="Edit">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-danger" @click="deleteSetting(setting.id)" title="Delete">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div v-if="totalSettings > 0" class="d-flex justify-content-between align-items-center mt-3">
      <div class="text-muted small">
        Showing {{ (currentPage * perPage) + 1 }}-{{ Math.min((currentPage + 1) * perPage, totalSettings) }} of {{ totalSettings }} settings
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="small text-muted">Page</span>
        <div class="btn-group" role="group">
          <button
            @click="goToPage(currentPage - 1)"
            class="btn btn-sm btn-outline-secondary"
            :disabled="currentPage === 0"
            title="Previous page"
          >
            &laquo;
          </button>
          <select v-model.number="currentPage" @change="goToPage(currentPage)" class="form-select form-select-sm bg-primary text-white border-primary" style="width: auto; border-radius: 0;">
            <option v-for="page in totalPages" :key="page" :value="page - 1">{{ page }}</option>
          </select>
          <button
            @click="goToPage(currentPage + 1)"
            class="btn btn-sm btn-outline-secondary"
            :disabled="currentPage >= totalPages - 1"
            title="Next page"
          >
            &raquo;
          </button>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="small">Per page</span>
        <select v-model="perPage" @change="changePerPage()" class="form-select form-select-sm" style="width: auto;">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>

    <!-- Filter Modal -->
    <template v-if="showFilterModal">
      <div class="modal-backdrop fade show" style="display: block; z-index: 1040;"></div>
      <div class="modal fade show" style="display: block; z-index: 1050;">
        <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Filter Conditions</h5>
              <button type="button" class="btn-close" @click="closeFilterModal()"></button>
            </div>
            <div class="modal-body">
              <p class="text-muted small mb-3">
                Add multiple conditions to filter settings. Conditions are combined with AND.
              </p>

              <div v-for="(c, i) in modalConditions" :key="i" class="row g-2 mb-2 align-items-end">
                <div class="col-md-4">
                  <label class="form-label small">Field</label>
                  <select v-model="c.field" class="form-select form-select-sm" @change="onFieldChange(c)">
                    <option value="">— Select field —</option>
                    <option v-for="opt in conditionOptions" :key="opt.value" :value="opt.value">{{ opt.label }}</option>
                  </select>
                </div>
                <div class="col-md-3" v-if="c.field">
                  <label class="form-label small">Match</label>
                  <select v-model="c.operator" class="form-select form-select-sm">
                    <option v-for="op in getFieldOperators(c.field)" :key="op" :value="op">{{ opLabel(op) }}</option>
                  </select>
                </div>
                <div class="col-md-3" v-if="c.field">
                  <label class="form-label small">Value</label>
                  <input v-if="getFieldInputType(c.field) === 'text'" v-model="c.value" type="text" class="form-control form-control-sm" :placeholder="getFieldPlaceholder(c.field)">
                  <input v-else-if="getFieldInputType(c.field) === 'date'" v-model="c.value" type="date" class="form-control form-control-sm">
                  <select v-else-if="getFieldInputType(c.field) === 'select'" v-model="c.value" class="form-select form-select-sm">
                    <option value="">— Select —</option>
                    <option v-for="s in getFieldSelectOptions(c.field)" :key="s.value" :value="s.value">{{ s.label }}</option>
                  </select>
                </div>
                <div class="col-md-2" v-if="c.field">
                  <button class="btn btn-outline-danger btn-sm w-100" @click="removeModalCondition(i)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>

              <button class="btn btn-outline-primary btn-sm mt-2" @click="addModalCondition">
                <i class="bi bi-plus-circle"></i> Add Condition
              </button>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary me-auto" @click="closeFilterModal()"><i class="bi bi-chevron-left me-2"></i>Cancel</button>
              <button type="button" class="btn btn-outline-danger" @click="clearModalConditions" v-if="modalConditions.length > 0">Clear All</button>
              <button type="button" class="btn btn-primary" @click="applyConditions()"><i class="bi bi-check-lg me-2"></i>Apply Filters</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Create/Edit Setting Modal -->
    <template v-if="showEditModal">
      <div class="modal-backdrop fade show" style="display: block; z-index: 1040;"></div>
      <div class="modal fade show" style="display: block; z-index: 1050;">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">{{ editingSetting ? 'Edit Setting' : 'Create New Setting' }}</h5>
              <button type="button" class="btn-close" @click="showEditModal = false"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Key</label>
                <input v-model="form.key" type="text" class="form-control" placeholder="e.g. currency" :disabled="!!editingSetting">
              </div>
              <div class="mb-3">
                <label class="form-label">Value</label>
                <textarea v-model="form.value" class="form-control" rows="3" placeholder="Setting value"></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" @click="showEditModal = false">Cancel</button>
              <button class="btn btn-primary" @click="saveSetting" :disabled="saving">
                <span v-if="saving" class="spinner-border spinner-border-sm me-1"></span>
                Save
              </button>
            </div>
          </div>
        </div>
      </div>
    </template>
  </template>
</div>
