<div id="app">
  <template v-if="loading">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading data...</span>
      </div>
    </div>
  </template>

  <template v-else>
    <!-- Settings Editor -->
    <div class="card">
      <div class="card-header">
        <i class="bi bi-gear me-1"></i> Shop Settings
      </div>
      <div v-if="settings.length === 0" class="card-body text-muted">
        No settings to edit.
      </div>
      <div v-else class="list-group list-group-flush">
        <div v-for="setting in settings" :key="setting.id" class="list-group-item">
          <div class="row align-items-center g-2">
            <div class="col-md-4">
              <label class="form-label mb-0 fw-semibold">{{ settingLabel(setting.key) }}</label>
              <div class="text-muted small"><code>{{ setting.key }}</code></div>
            </div>
            <div class="col-md-5">
              <select v-if="setting.key === 'currency'" v-model="setting.value" class="form-select form-select-sm">
                <option v-for="c in currencies" :key="c" :value="c">{{ c }}</option>
              </select>
              <textarea v-else-if="setting.value.length > 100" v-model="setting.value" class="form-control form-control-sm" rows="3"></textarea>
              <input v-else v-model="setting.value" type="text" class="form-control form-control-sm">
            </div>
            <div class="col-md-3 text-md-end">
              <button class="btn btn-primary btn-sm" @click="saveSetting(setting)" :disabled="savingKey === setting.key">
                <span v-if="savingKey === setting.key" class="spinner-border spinner-border-sm me-1"></span>
                <i v-else class="bi bi-check-lg me-1"></i>Save
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>
