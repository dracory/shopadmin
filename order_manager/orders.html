<div id="app">
  <template v-if="loading">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading data...</span>
      </div>
    </div>
  </template>

  <template v-else>
    <!-- Filter Bar -->
    <div class="card bg-body-tertiary mb-3">
      <div class="card-body d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <button @click="openFilterModal()" class="btn btn-primary me-3">
            <i class="bi bi-funnel me-1"></i> Filters
          </button>
          <span class="text-body">{{ filterStatus }}</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button 
            @click="clearFilters()" 
            class="btn btn-sm btn-outline-secondary" 
            title="Clear all filters"
            v-if="hasActiveFilters"
          >
            <i class="bi bi-x-circle"></i>
          </button>
          <button class="btn btn-primary btn-sm" @click="loadOrders" title="Refresh">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Orders Table -->
    <div v-if="orders.length === 0" class="text-center py-4 text-muted border rounded">
      No orders found matching your criteria.
    </div>

    <div v-else class="table-responsive">
      <table class="table table-striped table-hover table-bordered align-middle">
        <thead>
          <tr>
            <th style="cursor: default;">
              <div class="d-flex flex-column">
                <span @click="sortBy('customer_name')" style="cursor: pointer;">
                  Name
                  <span v-if="sortByColumn === 'customer_name'">
                    {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
                  </span>
                </span>
                <span @click="sortBy('customer_email')" class="small text-muted" style="cursor: pointer;">
                  Email
                  <span v-if="sortByColumn === 'customer_email'">
                    {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
                  </span>
                </span>
              </div>
            </th>
            <th @click="sortBy('status')" style="cursor: pointer; width: 1px; white-space: nowrap;">
              Status
              <span v-if="sortByColumn === 'status'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th @click="sortBy('created_at')" style="cursor: pointer; width: 1px; white-space: nowrap;">
              Date
              <span v-if="sortByColumn === 'created_at'">
                {{ sortOrder === 'asc' ? '&#8595;' : '&#8593;' }}
              </span>
            </th>
            <th style="width: 100px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="order in orders" :key="order.id">
            <td>
              <div>{{ order.customer_name || '-' }}</div>
              <div class="small text-muted">{{ order.customer_email || '-' }}</div>
              <div class="small text-muted">Ref: {{ order.id }}</div>
            </td>
            <td>
              <span class="badge" :class="getStatusBadgeClass(order.status)">{{ order.status }}</span>
            </td>
            <td class="small" style="white-space: nowrap;" v-html="formatDate(order.created_at)"></td>
            <td>
              <a :href="urlOrderDetails.replace('ORDER_ID', order.id)" class="btn btn-sm btn-secondary" title="View">
                <i class="bi bi-eye"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div v-if="totalOrders > 0" class="d-flex justify-content-between align-items-center mt-3">
      <div class="text-muted small">
        Showing {{ (currentPage * perPage) + 1 }}-{{ Math.min((currentPage + 1) * perPage, totalOrders) }} of {{ totalOrders }} orders
      </div>
      <div class="d-flex align-items-center justify-content-center flex-grow-1">
        <div class="d-flex align-items-center gap-2">
          <span class="small text-muted">Page</span>
          <div class="btn-group" role="group">
            <button 
              @click="goToPage(currentPage - 1)" 
              class="btn btn-sm btn-outline-secondary"
              :disabled="currentPage === 0"
              title="Previous page"
            >
              &laquo;
            </button>
            <select v-model.number="jumpToPage" @change="goToPage(jumpToPage - 1)" class="form-select form-select-sm bg-primary text-white border-primary" style="width: auto; border-radius: 0;">
              <option v-for="page in totalPages" :key="page" :value="page">{{ page }}</option>
            </select>
            <button 
              @click="goToPage(currentPage + 1)" 
              class="btn btn-sm btn-outline-secondary"
              :disabled="currentPage >= totalPages - 1"
              title="Next page"
            >
              &raquo;
            </button>
          </div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="small">Per page</span>
        <select v-model="perPage" @change="changePerPage()" class="form-select form-select-sm" style="width: auto;">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>

    <!-- Filter Modal -->
    <div v-if="showFilterModal" class="modal-backdrop fade show" style="display: block; z-index: 1040;"></div>
    <div v-if="showFilterModal" class="modal fade show" style="display: block; z-index: 1050;">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Filter Conditions</h5>
            <button type="button" class="btn-close" @click="closeFilterModal()"></button>
          </div>
          <div class="modal-body">
            <p class="text-muted small mb-3">
              Add multiple conditions to filter orders. Conditions are combined with AND.
            </p>

            <div v-for="(c, i) in modalConditions" :key="i" class="row g-2 mb-2 align-items-end">
              <div class="col-md-4">
                <label class="form-label small">Field</label>
                <select v-model="c.field" class="form-select form-select-sm" @change="onFieldChange(c)">
                  <option value="">— Select field —</option>
                  <option v-for="opt in conditionOptions" :key="opt.value" :value="opt.value">{{ opt.label }}</option>
                </select>
              </div>
              <div class="col-md-3" v-if="c.field">
                <label class="form-label small">Match</label>
                <select v-model="c.operator" class="form-select form-select-sm">
                  <option v-for="op in getFieldOperators(c.field)" :key="op" :value="op">{{ opLabel(op) }}</option>
                </select>
              </div>
              <div class="col-md-3" v-if="c.field">
                <label class="form-label small">Value</label>
                <input v-if="getFieldInputType(c.field) === 'text'" v-model="c.value" type="text" class="form-control form-control-sm" :placeholder="getFieldPlaceholder(c.field)">
                <input v-else-if="getFieldInputType(c.field) === 'date'" v-model="c.value" type="date" class="form-control form-control-sm">
                <select v-else-if="getFieldInputType(c.field) === 'select'" v-model="c.value" class="form-select form-select-sm">
                  <option value="">— Select —</option>
                  <option v-for="s in getFieldSelectOptions(c.field)" :key="s.value" :value="s.value">{{ s.label }}</option>
                </select>
              </div>
              <div class="col-md-2" v-if="c.field">
                <button class="btn btn-outline-danger btn-sm w-100" @click="removeModalCondition(i)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>

            <button class="btn btn-outline-primary btn-sm mt-2" @click="addModalCondition">
              <i class="bi bi-plus-circle"></i> Add Condition
            </button>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary me-auto" @click="closeFilterModal()"><i class="bi bi-chevron-left me-2"></i>Cancel</button>
            <button type="button" class="btn btn-outline-danger" @click="clearModalConditions" v-if="modalConditions.length > 0">Clear All</button>
            <button type="button" class="btn btn-primary" @click="applyConditions()"><i class="bi bi-check-lg me-2"></i>Apply Filters</button>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>
