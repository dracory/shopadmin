<!-- Card header: collapse toggle (title left) + Save button (right) -->
<div
    class="card-header d-flex justify-content-between align-items-center"
    style="cursor: pointer; user-select: none;"
    @click="collapsed = !collapsed"
>
    <h4 style="margin-bottom: 0;">
        <i class="bi me-2" :class="collapsed ? 'bi-plus-circle' : 'bi-dash-circle'"></i>
        <span>Product Details</span>
    </h4>
    <!-- Wrapper stops propagation so a click on Save never toggles. -->
    <div @click.stop>
        <button
            type="button"
            class="btn btn-success"
            @click="saveDetails"
            :disabled="loading"
        >
            <span v-if="loading" class="spinner-border spinner-border-sm me-2"></span>
            <i v-else class="bi bi-check-lg me-2"></i>
            Save
        </button>
    </div>
</div>

<!-- Collapsible card body -->
<div id="productDetailsCollapse" class="collapse" :class="{ show: !collapsed }">
    <div class="card-body">
        <template v-if="loading">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading data...</span>
                </div>
            </div>
        </template>

        <template v-else>
            <form @submit.prevent="saveDetails">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Title <span class="text-danger">*</span></label>
                        <input
                            type="text"
                            class="form-control"
                            v-model="title"
                            placeholder="Enter product title..."
                            required
                        >
                        <small class="text-muted">The title of the product.</small>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold">Description</label>
                        <div ref="descriptionContainer"></div>
                        <small class="text-muted">The description of the product.</small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Price <span class="text-danger">*</span></label>
                        <input
                            type="number"
                            class="form-control"
                            v-model="price"
                            placeholder="Enter price..."
                            step="0.01"
                            min="0"
                            required
                        >
                        <small class="text-muted">The price of the product.</small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Quantity <span class="text-danger">*</span></label>
                        <input
                            type="number"
                            class="form-control"
                            v-model="quantity"
                            placeholder="Enter quantity..."
                            min="0"
                            required
                        >
                        <small class="text-muted">The quantity of the product that is available to purchase.</small>
                    </div>
                </div>
            </form>
        </template>
    </div>
</div>
