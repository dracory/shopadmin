<div id="categories-app">
    <template v-if="loading">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading data...</span>
            </div>
        </div>
    </template>

    <template v-else>
        <!-- Success Message -->
        <div v-if="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
            {{ successMessage }}
            <button type="button" class="btn-close" @click="successMessage = ''"></button>
        </div>

        <!-- Error Message -->
        <div v-if="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ errorMessage }}
            <button type="button" class="btn-close" @click="errorMessage = ''"></button>
        </div>

        <!-- Product Categories Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">
                <i class="bi bi-diagram-3 me-2"></i>
                <span>Categories</span>
            </h5>
            <button
                type="button"
                class="btn btn-success"
                @click="saveCategories"
                :disabled="loading || !hasChanges"
            >
                <span v-if="loading" class="spinner-border spinner-border-sm me-2"></span>
                <i v-else class="bi bi-check-lg me-2"></i>
                Save
            </button>
        </div>

        <!-- Category Checklist -->
        <div v-if="categories.length > 0" class="row">
            <div v-for="category in categories" :key="category.id" class="col-md-4 col-sm-6 mb-2">
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        :id="'cat-' + category.id"
                        :value="category.id"
                        v-model="selectedCategoryIDs"
                    >
                    <label class="form-check-label" :for="'cat-' + category.id">
                        {{ category.title }}
                    </label>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div v-else class="alert alert-info mb-0">
            <i class="bi bi-info-circle me-2"></i>
            <span>No categories found. Create categories first in the Category Manager.</span>
        </div>
    </template>
</div>
