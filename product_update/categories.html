<!-- Card header: collapse toggle (title left) + Save button (right) -->
<div
    class="card-header d-flex justify-content-between align-items-center"
    style="cursor: pointer; user-select: none;"
    @click="collapsed = !collapsed"
>
    <h4 style="margin-bottom: 0;">
        <i class="bi me-2" :class="collapsed ? 'bi-plus-circle' : 'bi-dash-circle'"></i>
        <span>Categories</span>
    </h4>
    <!-- Wrapper stops propagation so a click on Save (even while the
         button is disabled and emits no click itself) never toggles. -->
    <div @click.stop>
        <button
            type="button"
            class="btn btn-success"
            @click="saveCategories"
        >
            <span v-if="loading" class="spinner-border spinner-border-sm me-2"></span>
            <i v-else class="bi bi-check-lg me-2"></i>
            Save
        </button>
    </div>
</div>

<!-- Collapsible card body -->
<div id="productCategoriesCollapse" class="collapse" :class="{ show: !collapsed }">
    <div class="card-body">
        <template v-if="loading">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading data...</span>
                </div>
            </div>
        </template>

        <template v-else>
            <!-- Category Checklist -->
            <div v-if="categories.length > 0" class="row">
                <div v-for="category in categories" :key="category.id" class="col-md-4 col-sm-6 mb-2">
                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            :id="'cat-' + category.id"
                            :value="category.id"
                            v-model="selectedCategoryIDs"
                        >
                        <label class="form-check-label" :for="'cat-' + category.id">
                            {{ category.title }}
                        </label>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div v-else class="alert alert-info mb-0">
                <i class="bi bi-info-circle me-2"></i>
                <span>No categories found. Create categories first in the Category Manager.</span>
            </div>
        </template>
    </div>
</div>
